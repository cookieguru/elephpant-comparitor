name: Build README

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2

      - name: Build README
        run: php build-readme.php

      - name: Commit README
        run: |
          git add README.md

          if git diff --cached --quiet -- README.md; then
            echo "No README changes"
            exit 0
          fi

          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

          git add README.md

          git commit -m "Update README with data from $(date '+%Y-%m-%d %H:%M:%S %z')"
          git push
